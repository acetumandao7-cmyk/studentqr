{% extends "base.html" %}
{% block title %}Sign In - Smart Student Attendance System{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 4rem); display: flex; align-items: center; justify-content: center; padding: 1rem 0;">
    <div style="width: 100%; max-width: 440px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.65rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Smart Attendance System</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.25rem;">Sign in to access your administrative or teacher portal</p>
        </div>
        <div class="card" style="box-shadow: var(--shadow-lg);">
            <div class="card-body" style="padding: 2.25rem;">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="form-group">
                        <label class="form-label" for="username">Username or Email</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="admin or teacher" required autofocus>
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="form-label" for="password" style="margin-bottom: 0.4rem;">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #475569; cursor: pointer;">
                            <input type="checkbox" name="remember" value="1" style="accent-color: var(--primary);">
                            <span>Remember this device</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
                        <span>Sign In</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
